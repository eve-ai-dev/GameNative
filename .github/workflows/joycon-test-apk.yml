name: Joy-Con test APK

on:
  workflow_dispatch:
  push:
    branches: ["build/joycon-test-apk"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject non-production credentials
        run: |
          cat > local.properties <<'EOF'
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://example.invalid
          EOF

      - name: Run Joy-Con unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest :app:testModernDebugUnitTest --tests com.winlator.inputcontrols.JoyConSupportTest

      - name: Build isolated modern APK
        run: ./gradlew :app:assembleModernDebug

      - name: Stage artifact
        run: cp app/build/outputs/apk/modern/debug/app-modern-debug.apk GameNative-JoyCon-Test-Y700.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: GameNative-JoyCon-Test-Y700
          path: GameNative-JoyCon-Test-Y700.apk
          if-no-files-found: error
          retention-days: 7