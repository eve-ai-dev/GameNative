name: Joy-Con test APK

on:
  workflow_dispatch:
  push:
    branches: ["build/joycon-test-apk"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject non-production credentials
        run: |
          cat > local.properties <<'EOF'
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://example.invalid
          EOF

      - name: Run Joy-Con unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest :app:testModernDebugUnitTest --tests com.winlator.inputcontrols.JoyConSupportTest

      - name: Build isolated modern APK
        run: ./gradlew :app:assembleModernRelease

      - name: Stage artifact
        run: cp app/build/outputs/apk/modern/release/app-modern-release.apk GameNative-JoyCon-Test-Y700.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: GameNative-JoyCon-Test-Y700
          path: GameNative-JoyCon-Test-Y700.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish clearly marked prerelease
        if: github.repository == 'eve-ai-dev/GameNative'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete joycon-test-y700-20260824 --cleanup-tag --yes || true
          gh release create joycon-test-y700-20260824 \
            GameNative-JoyCon-Test-Y700.apk \
            --target "${{ github.sha }}" \
            --title "Joy-Con pairing test APK for Lenovo Y700" \
            --notes "Experimental debug-signed build for physical validation of paired Joy-Con input. Package: app.gamenative.joycontest. It can coexist with the official GameNative app. Do not use as a normal installation or enter production credentials." \
            --prerelease