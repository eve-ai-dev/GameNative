name: Pull Request build check

on:
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Inject credentials
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          printf 'POSTHOG_API_KEY=%s\n' "${POSTHOG_API_KEY:-dummy}" > local.properties
          printf 'POSTHOG_HOST=%s\n' "${POSTHOG_HOST:-https://us.i.posthog.com}" >> local.properties
      - name: Inject dummy credentials
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          EOF
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Checkout pinned SDL headers
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-2.32.10
          path: app/build/SDL
          sparse-checkout: include
      - name: Build isolated-storage evshim bridge
        run: |
          set -o pipefail
          NDK_VERSION=27.3.13750724
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
          cmake -S app/src/main/cpp/evshim -B app/build/evshim \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DSDL2_INCLUDE_DIR="$GITHUB_WORKSPACE/app/build/SDL/include" \
            -DCMAKE_BUILD_TYPE=Release
          if ! cmake --build app/build/evshim --parallel 2 2>&1 | tee app/build/evshim-build.log; then
            message=$(tail -c 1500 app/build/evshim-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            printf '::error file=app/src/main/cpp/evshim/evshim.c::%s\n' "$message"
            exit 1
          fi
          install -m 0755 app/build/evshim/libevshim.so app/src/main/jniLibs/arm64-v8a/libevshim.so
          nm -D app/src/main/jniLibs/arm64-v8a/libevshim.so | grep -q Java_com_winlator_winhandler_WinHandler_initializeSharedMemory
      - name: Run unit tests
        run: |
          set -o pipefail
          if ! ./gradlew :app:testLegacyDebugUnitTest :app:testModernDebugUnitTest --no-daemon --max-workers=2 2>&1 | tee app/build/unit-tests.log; then
            message=$(tail -c 3000 app/build/unit-tests.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            printf '::error file=app/build/unit-tests.log::%s\n' "$message"
            exit 1
          fi
      - name: Upload failed unit-test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-${{ github.sha }}
          path: |
            app/build/unit-tests.log
            app/build/reports/tests/
          if-no-files-found: warn
      - name: Configure stable Joy-Con test signing
        if: github.event_name == 'workflow_dispatch'
        env:
          JOYCON_KEYSTORE_B64: ${{ secrets.JOYCON_KEYSTORE_B64 }}
          JOYCON_KEY_ALIAS: ${{ secrets.JOYCON_KEY_ALIAS }}
          JOYCON_KEYSTORE_PASSWORD: ${{ secrets.JOYCON_KEYSTORE_PASSWORD }}
          JOYCON_KEY_PASSWORD: ${{ secrets.JOYCON_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$JOYCON_KEYSTORE_B64"
          test -n "$JOYCON_KEY_ALIAS"
          test -n "$JOYCON_KEYSTORE_PASSWORD"
          test -n "$JOYCON_KEY_PASSWORD"
          mkdir -p app/keystores
          printf '%s' "$JOYCON_KEYSTORE_B64" | base64 --decode > app/keystores/joycontest.p12
          {
            printf 'storeFile=keystores/joycontest.p12\n'
            printf 'storePassword=%s\n' "$JOYCON_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$JOYCON_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$JOYCON_KEY_PASSWORD"
          } > app/keystores/joycontest.properties
      - name: Build isolated Modern release APK
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 35
        env:
          JOYCON_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleModernRelease -PjoyConVersionCode=$((100000 + JOYCON_VERSION_CODE)) --no-daemon --max-workers=2
      - name: Verify isolated APK signature
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/modern/release -name '*.apk' -type f -print -quit)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$AAPT"
          PACKAGE=$($AAPT dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          test "$PACKAGE" = "app.gamenative.joycontest"
          sha256sum "$APK"
      - name: Upload isolated Modern release APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-joycon-isolated-modern-${{ github.sha }}
          path: app/build/outputs/apk/modern/release/*.apk
          if-no-files-found: error
