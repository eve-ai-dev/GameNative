name: Pull Request build check

on:
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Inject credentials
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          printf 'POSTHOG_API_KEY=%s\n' "${POSTHOG_API_KEY:-dummy}" > local.properties
          printf 'POSTHOG_HOST=%s\n' "${POSTHOG_HOST:-https://us.i.posthog.com}" >> local.properties
      - name: Inject dummy credentials
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          EOF
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run focused Joy-Con unit tests
        timeout-minutes: 12 # Full dual-flavor suite exceeded 35 minutes; focused compile previously failed in under 4.
        run: ./gradlew :app:testLegacyDebugUnitTest --tests com.winlator.inputcontrols.JoyConSupportTest --no-daemon --max-workers=2
      - name: Build Legacy debug APK
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 35
        run: ./gradlew :app:assembleLegacyDebug --no-daemon --max-workers=2
      - name: Upload Legacy debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-joycon-legacy-debug-${{ github.sha }}
          path: app/build/outputs/apk/legacy/debug/*.apk
          if-no-files-found: error
